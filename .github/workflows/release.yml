name: Release

# Builds and tests the Windows and Linux packages, then creates a draft GitHub release.
# Started by hand so tags synced from upstream cannot trigger it. The tag is created when the
# draft is published. Local alternative: ci/release.sh.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.y.z, must match CMakeLists.txt)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version, changelog and tag
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid version: $VERSION"; exit 1; }
          project="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)"
          [[ "$project" == "$VERSION" ]] || { echo "::error::CMakeLists.txt has version $project"; exit 1; }
          grep -q "^## \[$VERSION\]" docs/CHANGELOG.md || { echo "::error::docs/CHANGELOG.md has no section for $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags "$REPOSITORY_URL" "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

  windows:
    name: Windows MSVC packages
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Keep repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Qt
        shell: bash
        run: |
          python ci/install-qt-windows.py --version 6.12.0 --output "$RUNNER_TOOL_CACHE/Qt" | tee qt-install.log
          echo "QT_ROOT_DIR=$(cygpath -w "$(tail -1 qt-install.log | tr -d '')")" >> "$GITHUB_ENV"
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
      - name: Build, test and smoke run
        shell: bash
        run: |
          export NPP_QT_MSVC_DIR="$(cygpath -m "$QT_ROOT_DIR")"
          bash ci/local-ci.sh --msvc
      - name: Package
        shell: pwsh
        run: ./ci/package-windows.ps1 -QtDir "$env:QT_ROOT_DIR" -Dist "$PWD\dist"
      - name: Test packages
        shell: pwsh
        run: ./ci/test-package-windows.ps1 -Dist "$PWD\dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: dist/notepadpp-qt-*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-windows
          path: |
            build/ci/logs/
            build/ci/artifacts/
            build/package/test-windows/report.txt
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Linux packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build, test and smoke run
        run: bash ci/local-ci.sh --linux
      - name: Package
        run: bash ci/package-linux.sh --dist "$PWD/dist"
      - name: Test packages
        run: bash ci/test-package-linux.sh --dist "$PWD/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: dist/notepadpp-qt-*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-linux
          path: |
            build/ci/logs/
            build/ci/artifacts/
            build/package/test-linux/report.txt
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Create draft release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ( cd dist && sha256sum -- notepadpp-qt-* > SHA256SUMS.txt && cat SHA256SUMS.txt )
          bash ci/release-notes.sh "$VERSION" "Built by GitHub Actions from commit \`$GITHUB_SHA\`; tests and package tests passed." > release-notes.md
          prerelease=()
          [[ "$VERSION" == 0.* ]] && prerelease=(--prerelease)
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft "${prerelease[@]}" \
            --target "$GITHUB_SHA" --title "Notepad++ Qt $VERSION (beta)" --notes-file release-notes.md \
            dist/notepadpp-qt-* dist/SHA256SUMS.txt
