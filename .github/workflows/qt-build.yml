name: Qt build

on:
  push:
    branches: [qt-port, 'feat/**']
  pull_request:
    branches: [qt-port]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docking abstraction (ADS must stay inside app/ui/docking/ads)
        run: bash ci/check-docking-abstraction.sh

  windows:
    name: Windows MSVC (Qt ${{ matrix.qt }}, dock ${{ matrix.dock }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        qt: ['6.8.*']
        dock: [ADS, QT]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: cmake --preset windows-msvc-release -DNPP_DOCKING_BACKEND=${{ matrix.dock }}
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Test
        run: ctest --test-dir build/windows-msvc-release --output-on-failure
      - name: Smoke run (offscreen screenshot)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/windows-msvc-release/bin/notepadpp-qt.exe --screenshot screenshot-windows-${{ matrix.dock }}.png app/ui/MainWindow.cpp
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-${{ matrix.dock }}
          path: screenshot-windows-*.png
          if-no-files-found: ignore

  linux:
    name: Linux GCC (Ubuntu 26.04, dock ${{ matrix.dock }})
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        dock: [ADS, QT]
    steps:
      - name: Install dependencies (keep in sync with ci/docker/linux.Dockerfile)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates \
            qt6-base-dev qt6-base-private-dev qt6-5compat-dev \
            libxcb1-dev libgl-dev fonts-dejavu-core fonts-noto-cjk
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset linux-release -DNPP_DOCKING_BACKEND=${{ matrix.dock }}
      - name: Build
        run: cmake --build --preset linux-release
      - name: Test
        run: ctest --test-dir build/linux-release --output-on-failure
      - name: Smoke run (offscreen screenshot)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/linux-release/bin/notepadpp-qt --screenshot screenshot-linux-${{ matrix.dock }}.png app/ui/MainWindow.cpp
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-${{ matrix.dock }}
          path: screenshot-linux-*.png
          if-no-files-found: ignore

  # macOS job is added in the week of 2026-11-09 (see docs/qt-cross-platform-port-plan.md §6.4).
